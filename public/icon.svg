<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <linearGradient id="bhagvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#431407" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#goldRing)" stroke-width="10" opacity="0.9" />

  <!-- Inner Saffron Bhagva Shield -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bhagvaGrad)" filter="url(#shadow)" />

  <!-- Saffron Sun Glow -->
  <circle cx="256" cy="220" r="160" fill="url(#sunGlow)" />

  <!-- Shield Badge with Stars -->
  <g transform="translate(256, 110) scale(1.8)">
    <path d="M0,-16 L6,-8 L0,-5 L-6,-8 Z" fill="#fef08a" opacity="0.95" />
    <path d="M-14,-10 L-7,-4 L-9,-3 Z" fill="#fde047" opacity="0.85" />
    <path d="M14,-10 L9,-3 L7,-4 Z" fill="#fde047" opacity="0.85" />
    <!-- Achievement Star -->
    <polygon points="0,-22 4,-12 14,-12 6,-6 9,4 0,-1 -9,4 -6,-6 -14,-12 -4,-12" fill="#fef08a" />
  </g>

  <!-- NCJ Monogram -->
  <text x="256" y="305" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" letter-spacing="4" filter="url(#shadow)">
    NCJ
  </text>

  <!-- Subtitle: MOCK TEST APP -->
  <rect x="96" y="345" width="320" height="42" rx="21" fill="#1c1917" opacity="0.85" />
  <rect x="98" y="347" width="316" height="38" rx="19" fill="none" stroke="url(#goldRing)" stroke-width="2" />
  <text x="256" y="373" text-anchor="middle" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="4">
    MOCK TEST APP
  </text>

  <!-- Bottom Tagline -->
  <text x="256" y="435" text-anchor="middle" fill="#fed7aa" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="1">
    MHT-CET • NEET • JEE
  </text>
</svg>
